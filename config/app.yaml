records_root: records
years: [2022, 2023, 2024, 2025]
include: all
rules_path: config/rules.yaml

# Explicitly declared non-parsed sources. `match` is a path substring.
ignored_sources: []

# Known-unavailable history is private operational data (it names real
# institutions and accounts), so it lives in a gitignored file. Copy
# config/coverage-gaps.example.yaml to config/coverage-gaps.yaml.
# Never infer these from filenames; unknown dates must say "unknown".
known_coverage_gaps_path: config/coverage-gaps.yaml

tax_professional:
  # The fourth spreadsheet column is the human explanation/business purpose.
  # Change to `raw` if the professional confirms he wants the bank's raw text.
  bank_description_source: note
