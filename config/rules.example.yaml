# Copy this file to config/rules.yaml. The real file is private/gitignored.
# Rules suggest merchant classification; they do not decide deductibility.
rules:
  - id: merchant.example-fuel
    version: 1
    match:
      contains: Example Fuel Station
    applies:
      years: [2024]
      institutions: [Chase]
    suggest:
      category: Fuel
      note: ""

  - id: merchant.example-software
    version: 1
    match:
      contains: Example Software
    applies:
      years: [2023, 2024]
    suggest:
      category: Software
      note: Needs business-purpose review

  # Regex matching is also supported. The pattern runs against lowercased
  # merchant + raw bank text, and note tokens {1}..{9} are filled with the
  # regex capture groups (useful for transfer directions/account endings).
  - id: transfer.example
    version: 1
    match:
      regex: 'online transfer to chk \.{3}(\d+)'
    suggest:
      category: Bank Transfer
      note: Transferred money OUT INTO own account ending {1}
