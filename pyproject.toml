[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-records-automation"
version = "0.2.0"
description = "Auditable statement ingestion and human-reviewed tax exports"
requires-python = ">=3.9"
dependencies = [
  "pdfplumber==0.11.8",
  "PyYAML==6.0.3",
]

[project.scripts]
financial-automation = "financial_automation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
